g1_xr_teleop_node:
  ros__parameters:
    dry_run: true
    control_rate_hz: 30.0
    input_mode: controller
    display_mode: pass-through
    arm_model: G1ARM5
    img_server_ip: 192.168.123.164
    enable_xr: false
    enable_ik: false
    ik_backend: native_optimization
    ik_position_weight: 50.0
    ik_regularization_weight: 0.02
    ik_smooth_weight: 0.1
    ik_max_nfev: 30
    ik_ftol: 0.0001
    ik_xtol: 0.0001
    ik_gtol: 0.0001
    ik_max_output_step_rad: 0.1
    ik_max_position_error_m: 0.30
    ik_max_rotation_error_rad: 2.0
    ik_filter_weights: [0.4, 0.3, 0.2, 0.1]
    arm_tracking_mode: relative_clutch
    arm_position_scale: 1.0
    arm_rotation_scale: 1.0
    enable_arm: true
    enable_loco: true
    require_deadman: true
    deadman_source: right_trigger
    deadman_threshold: 0.2
    max_abs_joint_step_rad: 0.20
    arm_command_duration_sec: 0.05
    loco_command_duration_sec: 0.15
    loco_continuous: true
    loco_max_vx: 0.50
    loco_max_vy: 0.30
    loco_max_omega: 0.80
    loco_deadzone: 0.08
    print_debug: true
    xr_stuck_timeout_sec: 1.0
    g1arm7_joint_names:
      - left_shoulder_pitch
      - left_shoulder_roll
      - left_shoulder_yaw
      - left_elbow
      - left_wrist_roll
      - left_wrist_pitch
      - left_wrist_yaw
      - right_shoulder_pitch
      - right_shoulder_roll
      - right_shoulder_yaw
      - right_elbow
      - right_wrist_roll
      - right_wrist_pitch
      - right_wrist_yaw
    g1arm5_joint_names:
      - left_shoulder_pitch
      - left_shoulder_roll
      - left_shoulder_yaw
      - left_elbow_pitch
      - left_elbow_roll
      - right_shoulder_pitch
      - right_shoulder_roll
      - right_shoulder_yaw
      - right_elbow_pitch
      - right_elbow_roll
